[led]
logging=1
# global chip max current: 5 | 10 | 15 | 30 mA
imax=30

# GUI preview calibration ONLY - the daemon ignores this section. The
# picker swatch and the Info live swatch simulate what the LED set
# actually shows: per-LED luminous weight (green=100 is the reference)
# then a perception curve (gamma). On a typical cheap LED set the red
# diode is ~half as bright as green at equal PWM/current, so r=50.
# Tune these to YOUR LEDs: pick equal/known PWM+cur on all channels,
# compare, and adjust until the swatch matches the light.
[preview]
r=50
g=100
b=80
gamma=2.2

# ASCII only. Save applies on the next daemon event (mtime reload).
#
# [priority] event pool ranking, BIGGER WINS, one key per kind.
#            The daemon compares nothing hardcoded, so this
#            section IS the arbitration. A loser keeps its
#            state and takes the LEDs back when the winner
#            ends. All six kinds are ordinary entries of one
#            pool - the charge band included, it just has the
#            lowest default rank. No test button owns a key
#            here: a test is an entry of that kind marked as
#            a test, and the pool ranks a test above all.
# [suppress] one package per line - never lights the LED
# [rules]    pkg=r,g,b  (0-255 per channel)
#            + optional own cap and preset: cap, then the
#            render fields the render= line uses after its
#            colour. Missing field -> colour only.
# [charge]   thresholds ONLY; each band owns its render line
# [notify]   shared behavior: max_sec, screen basin;
#            the render colour is the default app colour
# [ring]     incoming call rainbow: max_sec, render
# [voip]     messenger call rainbow: max_sec, render
# [led]      daemon logging + global chip Imax
# [missed]   missed-call indication: max_sec, render
# [alarm]    alarm clock indication: max_sec, render
#
# v6 renderer: one render= line per section carries the
# colour, the mode, the solid current and the preset
# breath and wave share. A colour has no key of its own.
# All 17 fields after the colour are required:
#   render=<r,g,b>,<mode>,<cur_r,g,b>,pattern,<sync>,
#          <repeat>,<cur_r,g,b>,<rise>,<hold>,<fall>,
#          <offt>,<t0_r,g,b>

[priority]
ring=50
voip=40
alarm=30
missed=20
notify=10
charge=0

[suppress]
com.wfcind.app
com.google.android.googlequicksearchbox
com.socialnmobile.dictapps.notepad.color.note
com.android.providers.media.module
com.google.android.apps.nbu.files
com.android.systemui
org.amnezia.vpn
android
com.android.shell

[rules]
org.telegram.messenger=255,32,255,0,breath,15,15,15,pattern,1,0,15,1,11,500,100,500,1200,0,1300,2600

[charge]
first_threshold=70
second_threshold=95

[charge.lower]
render=128,8,8,solid,15,15,15,pattern,1,0,4,0,0,700,100,700,900,0,1300,2600

[charge.middle]
render=145,56,0,solid,5,5,5,pattern,1,0,5,1,0,700,100,700,900,0,1300,2600

[charge.upper]
render=64,128,32,solid,1,1,1,pattern,0,0,15,15,15,700,100,700,900,0,1300,2600

[notify]
max_sec=0
notify_screen_delay_ms=60000
render=255,255,255,breath,15,15,15,pattern,1,0,15,11,11,500,100,500,1200,0,1300,2600

[ring]
max_sec=300
render=255,255,255,wave,15,15,15,pattern,0,0,15,15,15,800,200,800,400,0,1300,2600

[voip]
max_sec=300
render=255,255,255,wave,15,15,15,pattern,0,0,15,15,15,800,200,800,400,0,1300,2600

[missed]
max_sec=0
render=0,255,255,breath,15,15,15,pattern,0,0,15,15,15,500,100,500,1200,0,1300,2600

[alarm]
max_sec=0
render=255,155,0,breath,15,15,15,pattern,0,0,15,15,15,500,100,500,1200,0,1300,2600

[led]
logging=1
imax=30

# GUI preview calibration (daemon ignores): how bright each
# LED looks vs the picker value. green=100 is the reference;
# gamma bends the curve toward your eye. Tune to your LED set.
[preview]
r=50
g=100
b=80
gamma=2.2

# led_hal_root runtime config - canonical template (always overwrites on install).
# ASCII only. Save applies on the next daemon event (the daemon watches
# this file with inotify; SIGALRM from the GUI is an explicit extra poke).
#
# Ownership rule: every setting lives in the section that owns it.
#   common keys -> the event's base section
#   renderer    -> [sec]      mode = off|solid|breath|wave
#   chip keys   -> [sec.solid]/[sec.breath]/[sec.wave]
# There is NO fallback: a chip section carries its OWN rise/hold/fall/offt.
#
# [suppress] one package per line - never lights the LED
# [rules]    pkg=r,g,b  (0-255 per channel)
# [charge]   first_threshold / second_threshold ONLY (percent, order-free).
#            Each band owns its renderer, color and timing:
#            [charge.lower|middle|upper] mode + color, chip sections below
# [notify]   default_color (only for apps without a [rules] entry),
#            notif_max_sec, notify_screen_delay_ms
# [notify.app]  renderer preset for apps that DO have a [rules] entry
#            (notif_max_sec + notify_screen_delay_ms override the base)
#
# Chip sections (per event):
#   [sec.solid]     cur = per-channel current 0..15 (15 = full)
#   [sec.breath]    repeat=0 loop forever, 1..15 capped cycles,
#                   cur_r/cur_g/cur_b current 0..15,
#                   rise/hold/fall/offt = breathing timing (ms)
#   [sec.wave]      t0=r,g,b (ms) staggers the channels -> color glides
#                   the channel sequence, repeat=0..15,
#                   rise/hold/fall/offt = breathing timing (ms)
#
# The chip quantizes timings to its 16 discrete times, nearest wins.

[suppress]
com.wfcind.app
com.google.android.googlequicksearchbox
com.socialnmobile.dictapps.notepad.color.note
com.android.providers.media.module
com.google.android.apps.nbu.files
com.android.systemui
org.amnezia.vpn
android
com.android.shell

[rules]
org.telegram.messenger=0,255,255

[charge]
first_threshold=70
second_threshold=95

[charge.lower]
mode=breath
color=255,32,32

[charge.lower.solid]
cur=15,15,15

[charge.lower.breath]
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=700
hold=100
fall=700
offt=900

[charge.lower.wave]
t0=0,1300,2600
repeat=0
rise=700
hold=100
fall=700
offt=900

[charge.middle]
mode=breath
color=255,127,32

[charge.middle.solid]
cur=15,15,15

[charge.middle.breath]
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=700
hold=100
fall=700
offt=900

[charge.middle.wave]
t0=0,1300,2600
repeat=0
rise=700
hold=100
fall=700
offt=900

[charge.upper]
mode=solid
color=64,255,32

[charge.upper.solid]
cur=15,15,15

[charge.upper.breath]
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=700
hold=100
fall=700
offt=900

[charge.upper.wave]
t0=0,1300,2600
repeat=0
rise=700
hold=100
fall=700
offt=900

[notify]
notif_max_sec=0
notify_screen_delay_ms=60000
default_color=255,255,255
mode=breath

[notify.solid]
cur=15,15,15

[notify.breath]
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=500
hold=100
fall=500
offt=1200

[notify.wave]
t0=0,1300,2600
repeat=0
rise=500
hold=100
fall=500
offt=1200

# renderer for apps that DO have a [rules] entry (notify.app preset)
[notify.app]
notif_max_sec=0
notify_screen_delay_ms=60000
mode=breath

[notify.app.solid]
cur=15,15,15

[notify.app.breath]
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=500
hold=100
fall=500
offt=1200

[notify.app.wave]
t0=0,1300,2600
repeat=0
rise=500
hold=100
fall=500
offt=1200

[ring]
test_sec=30
max_sec=300
color=255,255,255
mode=wave

[ring.solid]
cur=15,15,15

[ring.breath]
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=800
hold=200
fall=800
offt=400

[ring.wave]
t0=0,1300,2600
repeat=0
rise=800
hold=200
fall=800
offt=400

[voip]
max_sec=300
# packages: comma list overrides the built-in messenger set
packages=org.telegram.messenger,com.whatsapp,com.viber.voip
color=255,255,255
mode=wave

[voip.solid]
cur=15,15,15

[voip.breath]
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=800
hold=200
fall=800
offt=400

[voip.wave]
t0=0,1300,2600
repeat=0
rise=800
hold=200
fall=800
offt=400

[missed]
color=0,255,255
max_sec=0
mode=breath

[missed.solid]
cur=15,15,15

[missed.breath]
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=500
hold=100
fall=500
offt=1200

[missed.wave]
t0=0,1300,2600
repeat=0
rise=500
hold=100
fall=500
offt=1200

[alarm]
color=255,155,0
max_sec=0
mode=breath

[alarm.solid]
cur=15,15,15

[alarm.breath]
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=500
hold=100
fall=500
offt=1200

[alarm.wave]
t0=0,1300,2600
repeat=0
rise=500
hold=100
fall=500
offt=1200

[led]
logging=1
# watchdog_ms: NLS app polls chgd every N ms (crash insurance) - 0 disables
watchdog_ms=60000
# trace_sysfs=1 logs every LED sysfs write to the daemon log (debug only)
trace_sysfs=0
# global chip max current: 5 | 10 | 15 | 30 mA
imax=30

# led_hal_root runtime config - canonical template (always overwrites on install).
# ASCII only. Save applies on the next daemon event (the daemon watches
# this file with inotify; SIGALRM from the GUI is an explicit extra poke).
#
# Ownership rule: every setting lives in the section that owns it.
#   common keys -> the event's base section
#   renderer    -> [sec]      mode = off|solid|breath|wave
#   chip keys   -> [sec.solid]/[sec.pattern]
# Breath and wave share one pattern preset; t0 is used only by wave.
#
# [suppress] one package per line - never lights the LED
# [rules]    pkg=r,g,b[,cap[,mode[,solid_cur,pattern,sync,repeat,cur r,g,b,
#            rise,hold,fall,offt,t0 r,g,b]]]
#            (0-255 per channel). The optional comma tail carries THAT
#            app's own preset - cap (notif_max_sec, 0 = unlimited),
#            mode (off|solid|breath|wave), solid_cur (3x), then the named
#            shared pattern block. The pending window
#            (notify_screen_delay_ms) stays SHARED ([notify]).
#            Left-prefix: the first broken token stops the tail, that slot
#            and the rest fall back to defaults. WITHOUT a tail the app
#            keeps the shared [notify] preset like before.
# [charge]   first_threshold / second_threshold ONLY (percent, order-free).
#            Each band owns its renderer, color and timing:
#            [charge.lower|middle|upper] mode + color, chip sections below
# [notify]   default_color (only for apps without a [rules] entry),
#            notif_max_sec, notify_screen_delay_ms, mode + chip sections
#            (shared preset)
#
# Chip sections (per event):
#   [sec.solid]     cur = per-channel current 0..15 (15 = full)
#   [sec.pattern]   repeat=0 loop forever, 1..15 capped cycles,
#                   cur_r/cur_g/cur_b current 0..15,
#                   rise/hold/fall/offt = breathing timing (ms),
#                   sync=0|1 = master-channel sync,
#                   t0=r,g,b (ms) wave phase offsets (0..)
#
# sync (breath/wave): per-channel pattern controllers free-run on their
# own timing and the rise/fall period grows almost linearly with the PWM
# amplitude, so channels at different PWM levels drift out of phase.
# sync=1 sets LCFG0.SYNC (master = channel 0, red): the PWM written to
# channel 0 becomes the common amplitude for all three channels, the
# per-channel cur still applies, and the phases stay locked. Trade-off:
# in sync mode the color comes from the per-channel cur ratio, not the
# rgb PWM (green/blue PWM are ignored). Default 0 = chip default, off.
#
# The chip quantizes timings to its 16 discrete times, nearest wins.

[suppress]
com.wfcind.app
com.google.android.googlequicksearchbox
com.socialnmobile.dictapps.notepad.color.note
com.android.providers.media.module
com.google.android.apps.nbu.files
com.android.systemui
org.amnezia.vpn
android
com.android.shell

[rules]
# Full example: color + own cap + shared pattern preset. cap=0 means
# unlimited; the same pattern drives breath and wave. Pending window is shared.
org.telegram.messenger=255,32,255,0,breath,15,15,15,pattern,1,0,15,1,11,500,100,500,1200,0,15,15

[charge]
first_threshold=70
second_threshold=95

[charge.lower]
mode=solid
color=128,8,8

[charge.lower.solid]
cur=15,15,15

[charge.lower.pattern]
sync=1
repeat=0
cur_r=4
cur_g=0
cur_b=0
rise=700
hold=100
fall=700
offt=900
t0=0,1300,2600

[charge.middle]
mode=solid
color=145,56,0

[charge.middle.solid]
cur=5,5,5

[charge.middle.pattern]
sync=1
repeat=0
cur_r=5
cur_g=1
cur_b=0
rise=700
hold=100
fall=700
offt=900
t0=0,1300,2600

[charge.upper]
mode=solid
color=64,128,32

[charge.upper.solid]
cur=1,1,1

[charge.upper.pattern]
sync=0
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=700
hold=100
fall=700
offt=900
t0=0,1300,2600

[notify]
notif_max_sec=0
notify_screen_delay_ms=60000
default_color=255,255,255
mode=breath

[notify.solid]
cur=15,15,15

[notify.pattern]
sync=1
repeat=0
cur_r=15
cur_g=11
cur_b=11
rise=500
hold=100
fall=500
offt=1200
t0=0,1300,2600

[ring]
max_sec=300
color=255,255,255
mode=wave

[ring.solid]
cur=15,15,15

[ring.pattern]
sync=0
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=800
hold=200
fall=800
offt=400
t0=0,1300,2600

[voip]
max_sec=300
color=255,255,255
mode=wave

[voip.solid]
cur=15,15,15

[voip.pattern]
sync=0
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=800
hold=200
fall=800
offt=400
t0=0,1300,2600

[missed]
color=0,255,255
max_sec=0
mode=breath

[missed.solid]
cur=15,15,15

[missed.pattern]
sync=0
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=500
hold=100
fall=500
offt=1200
t0=0,1300,2600

[alarm]
color=255,155,0
max_sec=0
mode=breath

[alarm.solid]
cur=15,15,15

[alarm.pattern]
sync=0
repeat=0
cur_r=15
cur_g=15
cur_b=15
rise=500
hold=100
fall=500
offt=1200
t0=0,1300,2600

[led]
logging=1
# global chip max current: 5 | 10 | 15 | 30 mA
imax=30

# GUI preview calibration ONLY - the daemon ignores this section. The
# picker swatch and the Info live swatch simulate what the LED set
# actually shows: per-LED luminous weight (green=100 is the reference)
# then a perception curve (gamma). On a typical cheap LED set the red
# diode is ~half as bright as green at equal PWM/current, so r=50.
# Tune these to YOUR LEDs: pick equal/known PWM+cur on all channels,
# compare, and adjust until the swatch matches the light.
[preview]
r=50
g=100
b=80
gamma=2.2
